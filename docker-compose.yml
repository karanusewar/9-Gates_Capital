services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 9gates-app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - 9gates-network

networks:
 9gates-network:
   driver: bridge
